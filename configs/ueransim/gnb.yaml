# UERANSIM gNB — runs inside netns "ran"
mcc: '001'
mnc: '01'
nci: '0x000000010'      # NR Cell Identity (gNB-ID 32 bits + cell 4 bits)
idLength: 32
tac: 1

linkIp: 127.0.0.1       # RLS (simulated radio) towards UEs, UDP/4997
ngapIp: 10.10.0.2       # N2 (NGAP over SCTP) source address
gtpIp: 10.10.0.2        # N3 (GTP-U) local address

amfConfigs:
  - address: 10.10.0.1
    port: 38412

# S-NSSAIs advertised in NG Setup — must match AMF/NSSF configuration
slices:
  - sst: 1
    sd: 0x000001
  - sst: 2
    sd: 0x000002
  - sst: 3
    sd: 0x000003

ignoreStreamIds: true
