# AMF — access & mobility management. N2 (NGAP/SCTP) faces the gNB on the n3-core veth.
logger:
  file:
    path: /var/log/open5gs/amf.log
  level: info

global:
  max:
    ue: 1024

amf:
  sbi:
    server:
      - address: 127.0.0.5
        port: 7777
    client:
      scp:
        - uri: http://127.0.0.200:7777
  ngap:
    server:
      - address: 10.10.0.1          # N2 towards gNB in netns "ran"
  metrics:
    server:
      - address: 127.0.0.5
        port: 9090
  guami:
    - plmn_id: {mcc: 001, mnc: 01}
      amf_id:
        region: 2
        set: 1
  tai:
    - plmn_id: {mcc: 001, mnc: 01}
      tac: 1
  plmn_support:
    - plmn_id: {mcc: 001, mnc: 01}
      s_nssai:
        - {sst: 1, sd: 000001}      # eMBB
        - {sst: 2, sd: 000002}      # URLLC
        - {sst: 3, sd: 000003}      # mIoT
  security:
    integrity_order : [ NIA2, NIA1, NIA0 ]
    ciphering_order : [ NEA0, NEA2, NEA1 ]   # NEA0 first so NAS is readable in captures
  network_name:
    full: E2E5G-Lab
    short: E2E5G
  amf_name: e2e5g-amf0
  time:
    t3512:
      value: 540
