# NSSF — network slice selection. One NSI per S-NSSAI, all served by the same NRF.
logger:
  file:
    path: /var/log/open5gs/nssf.log

global:
  max:
    ue: 1024

nssf:
  sbi:
    server:
      - address: 127.0.0.14
        port: 7777
    client:
      scp:
        - uri: http://127.0.0.200:7777
      nsi:
        - uri: http://127.0.0.10:7777
          s_nssai: {sst: 1, sd: 000001}
        - uri: http://127.0.0.10:7777
          s_nssai: {sst: 2, sd: 000002}
        - uri: http://127.0.0.10:7777
          s_nssai: {sst: 3, sd: 000003}
